name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies with uv
        run: |
          uv venv .venv
          uv pip install --python .venv zensical markdown-gfm-admonition

      - name: Step 1 - Cleaning previous build artifacts
        run: |
          rm -rf site/
          cargo clean --doc

      - name: Step 2 - Compiling Rust API documentation
        run: |
          echo "-> Building host-native API docs (sim)..."
          cargo doc --no-deps -p sim
          
          echo "-> Building MCU-independent embedded API docs..."
          cargo doc --no-deps -p veloxity_core --target thumbv7em-none-eabihf

          # Each command must resolve a single STM32 model. Cargo unifies
          # dependency features within one invocation, while stm32-metapac
          # intentionally rejects simultaneous H743II and H753ZI features.
          echo "-> Building STM32 platform API docs for H743II..."
          cargo doc --no-deps -p stm_32 --features pixracerpro-h743ii --target thumbv7em-none-eabihf

          echo "-> Building Nucleo H753ZI API docs..."
          cargo doc --no-deps -p nucleo --target thumbv7em-none-eabihf

          echo "-> Building Pixracer Pro H743II API docs..."
          cargo doc --no-deps -p pixracerpro --target thumbv7em-none-eabihf

      - name: Step 3 - Building high-level Zensical site
        run: |
          .venv/bin/zensical build

      - name: Step 4 - Merging API documentation into site/api/
        run: |
          mkdir -p site/api
          if [ -d "target/doc" ]; then
              echo "-> Merging host target API docs..."
              cp -r target/doc/* site/api/
          fi
          if [ -d "target/thumbv7em-none-eabihf/doc" ]; then
              echo "-> Merging ARM target API docs..."
              cp -r target/thumbv7em-none-eabihf/doc/* site/api/
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

        # { "ESP32C5 ESP-NOW UART Bridge" = "https://github.com/magicc-safety/Veloxity/blob/main/tools/espnow_uart_bridge/README.md" },
        { "STM32 Board Guide" = "boards/stm32.md" }
    ] },
    # { "Firmware" = [
    #     # { "Core Architecture" = "architecture-guide.md" },
    #     # { "Feature Flags" = "features.md" },
    #     { "world.rs" = "https://github.com/magicc-safety/Veloxity/blob/main/crates/veloxity_core/src/world.rs" },
    #     { "control.rs" = "https://github.com/magicc-safety/Veloxity/blob/main/crates/veloxity_core/src/control.rs" },
    #     { "estimator/quad.rs" = "https://github.com/magicc-safety/Veloxity/blob/main/crates/veloxity_core/src/estimator/quad.rs" },
    #     { "controller/quad.rs" = "https://github.com/magicc-safety/Veloxity/blob/main/crates/veloxity_core/src/controller/quad.rs" },
    #     { "mixer/matrix.rs" = "https://github.com/magicc-safety/Veloxity/blob/main/crates/veloxity_core/src/mixer/matrix.rs" },
    #     { "link.rs" = "https://github.com/magicc-safety/Veloxity/blob/main/comms/veloxity_mavlink/src/link.rs" }

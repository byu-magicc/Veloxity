    { "Tutorials" = [
        {"Veloxity with the ROSflight Simulator" = "tutorials/sim_devpod.md"},
        {"ROS 2 Pixracer Pro Serial RTT Timing" = "tutorials/ros2-pixracerpro-serial-rtt-timing.md"}
        # { "Veloxity ROScopter Sim End-to-End" = "tutorials/veloxity-roscopter-sim-end-to-end.md" },
        # { "Pico 2 W Sensor Bring-Up" = "tutorials/pico2w-sensor-bringup.md" }
    ] },
    { "API" = "api/index.md" }
]

extra_css = [
    "stylesheets/extra.css"
]

extra_javascript = [
    "javascript/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

[project.theme]
name = "material"
logo = "assets/veloxity-logo-light-rust.svg"
favicon = "assets/veloxity-logo-light-rust.svg"
features = [
    "navigation.tabs",
    "navigation.sections",
    "navigation.top",
    "search.suggest",
    "search.highlight",
    "content.code.copy"
]
palette = [
    # Light mode
    { media = "(prefers-color-scheme: light)", scheme = "default", primary = "blue", accent = "orange", toggle = { icon = "material/brightness-7", name = "Switch to dark mode" } },
    # Dark mode
    { media = "(prefers-color-scheme: dark)", scheme = "slate", primary = "blue", accent = "orange", toggle = { icon = "material/brightness-4", name = "Switch to light mode" } }
]

[project.markdown_extensions]
admonition = {}
def_list = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.superfences]
preserve_tabs = true
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.gfm_admonition]

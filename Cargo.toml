[workspace]
resolver = "3"
members = [
  "boards/nucleo",
  "boards/pico2w",
  "boards/pixracerpro",
  "comms/veloxity_mavlink",
  "crates/veloxity_core",
  "platforms/rp2350",
  "platforms/stm_32",
  "sim/firmware",
  "sim/msgs",
  "sim/node",
  "xtask",
]
default-members = [
  "comms/veloxity_mavlink",
  "crates/veloxity_core",
  "sim/firmware",
  "xtask",
]

# Define your core library as a shared dependency
[workspace.dependencies]
veloxity_core = { path = "./crates/veloxity_core" }
veloxity_mavlink = { path = "./comms/veloxity_mavlink" }
rp2350_platform = { path = "./platforms/rp2350" }
stm_32 = { path = "./platforms/stm_32" }

[patch.crates-io]
ism330dhcx-rs = { path = "third_party/ism330dhcx-rs" }

[workspace.lints.rust]

# cargo build/run
[profile.dev]
codegen-units = 1       # no parallel compilation (better optimization but slower build)
debug = 2               # includes full debug info
debug-assertions = true # runtime checks enabled
incremental = false     # no incremental compliation so more stable optimizations
opt-level = 0           # no optimizations
overflow-checks = true  # integer overflow checks

# cargo build/run --release
[profile.release]
codegen-units = 1
#debug = 2
debug = false
debug-assertions = false # disables debug checks
incremental = false
lto = 'fat'              # link-time optimization (agressive whole-program optimization)
opt-level = 3            # maximum optimization
overflow-checks = false  # no overflow checks... faster but less safe

# cargo test
[profile.test]
codegen-units = 1
debug = 2               # full debug info for test failure
debug-assertions = true # debug checks during tests enabled
incremental = false
opt-level = 3           # agressive optimization (faster runtime during tests)
overflow-checks = true

# cargo test --release
[profile.bench]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
